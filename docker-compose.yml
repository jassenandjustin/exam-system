version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: exam-system-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exam_system
      MYSQL_USER: examuser
      MYSQL_PASSWORD: exampassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - exam-network

  backend:
    build: ./backend
    container_name: exam-system-backend
    environment:
      DATABASE_URL: mysql+pymysql://examuser:exampassword@db:3306/exam_system
      JWT_SECRET: your-secret-key-change-in-production
    ports:
      - "15000:15000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - exam-network

  frontend:
    build: ./frontend
    container_name: exam-system-frontend
    ports:
      - "15010:80"
    volumes:
      # 前端容器同时承担静态文件服务与 /api 反向代理（唯一入口）
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - exam-network

volumes:
  db_data:

networks:
  exam-network:
    driver: bridge
